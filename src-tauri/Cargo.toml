[package]
name = "fuse"
version = "0.1.0"
description = "Visual command workflow builder"
authors = ["Fuse"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "fuse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "time", "macros"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
semver = "1.0.28"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Keep the shipped binary small — this is meant to be a lightweight native tool.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
